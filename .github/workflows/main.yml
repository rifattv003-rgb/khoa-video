name: Render Remotion Video

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Render Video
        run: npx remotion render src/index.ts video out/khoa.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: khoa-video-output
          path: out/khoa.mp4
